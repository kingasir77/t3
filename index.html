<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مساعد تعديل التدريب</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card: rgba(30, 41, 59, 0.7);
            --stroke: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --text: #f1f5f9;
            --sub: #94a3b8;
            --radius-xl: 24px;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text);
            padding: 12px;
            line-height: 1.5;
            overflow-x: hidden; /* لمنع أي خروج عن الشاشة */
        }

        .container {
            max-width: 100%;
            width: 450px;
            margin: auto;
        }

        .topbar-inner {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--stroke);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .app-mini { display: flex; align-items: center; gap: 12px; }
        .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .title h1 { font-size: 0.95rem; font-weight: 800; }

        .card {
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: var(--radius-xl);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            width: 100%; /* ضمان عدم تجاوز العرض */
        }

        .grid { display: flex; flex-direction: column; gap: 15px; }
        
        /* إصلاح تداخل الخانات */
        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        label, .tiny {
            display: block;
            margin-bottom: 5px;
            color: var(--sub);
            font-size: 0.75rem;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }

        /* إصلاح عرض حقل التاريخ في الشاشات الصغيرة */
        .flatpickr-input { width: 100% !important; }

        input:focus { border-color: var(--primary); }

        .hijri-group { display: flex; gap: 4px; }
        .hijri-group select { padding: 10px 2px; font-size: 0.75rem; }

        .btn {
            background: var(--primary);
            color: white; border: none;
            border-radius: 14px; padding: 15px;
            font-weight: 800; width: 100%;
            cursor: pointer; margin-top: 5px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 15px;
            text-align: center;
            margin-top: 10px;
        }

        .result {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            margin-bottom: 10px;
            border: 1px solid var(--stroke);
        }
        
        .new-start-box { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.05); }
        .highlight { border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.08); }

        .info-label { font-size: 0.7rem; color: var(--sub); display: block; margin-bottom: 2px; }
        .info-value { font-size: 0.85rem; font-weight: 700; color: #fff; display: block; }
        .main-value { font-size: 1.1rem; font-weight: 900; display: block; }
        .sub-value { font-size: 0.8rem; color: var(--sub); display: block; margin-top: 2px; }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 0; border-top: 1px solid var(--stroke); font-size: 0.75rem; }
        
        .exc-range { display: block; font-weight: 600; color: #cbd5e1; font-size: 0.7rem; }
        .exc-days { color: var(--primary); font-weight: 800; }

        footer { text-align: center; color: var(--sub); font-size: 0.7rem; padding: 20px 0; }

        @media screen and (max-width: 400px) {
            .row-inputs { grid-template-columns: 1fr; } /* تحت بعض في الشاشات الصغيرة جداً */
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="topbar-inner">
            <div class="app-mini">
                <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="title"><h1>مساعد تعديل التدريب</h1></div>
            </div>
        </div>

        <div class="card">
            <div class="grid">
                <div>
                    <label>المدة المقررة</label>
                    <select id="level" onchange="calculate()">
                        <option value="18">18 شهر — المستوى الخامس</option>
                        <option value="24">24 شهر — المستوى السابع</option>
                    </select>
                </div>
                <div>
                    <label>تاريخ بداية التدريب</label>
                    <input type="text" id="startDate" readonly placeholder="حدد التاريخ">
                </div>
            </div>

            <div id="baseInfoBox" style="display:none">
                <div class="info-box">
                    <span class="info-label">تاريخ المباشرة (هجري)</span>
                    <span id="startH" class="info-value">-</span>
                </div>
            </div>
        </div>

        <div class="card">
            <label style="color:white; margin-bottom:12px; display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-calendar-plus" style="color: var(--primary);"></i> إضافة تمديد أو إجازة
            </label>
            
            <div class="grid">
                <div class="row-inputs">
                    <div>
                        <span class="tiny">من (ميلادي)</span>
                        <input type="text" id="excStartM" readonly placeholder="اختر">
                    </div>
                    <div>
                        <span class="tiny">إلى (ميلادي)</span>
                        <input type="text" id="excEndM" readonly placeholder="اختر">
                    </div>
                </div>

                <div>
                    <span class="tiny">أو حدد هجري (اختياري)</span>
                    <div class="hijri-group">
                        <select id="hDayS"><option value="">يوم</option></select>
                        <select id="hMonthS"><option value="">شهر</option></select>
                        <select id="hYearS"><option value="">سنة</option></select>
                    </div>
                </div>

                <input type="number" id="excDays" placeholder="أو أدخل عدد الأيام مباشرة">
                <button class="btn" onclick="addException()">إضافة للجدول</button>
            </div>
        </div>

        <div class="card">
            <div id="tableContainer" style="display:none; margin-bottom:15px;">
                <table>
                    <tbody id="excTableBody"></tbody>
                </table>
            </div>

            <div class="result">
                <span class="info-label">إجمالي أيام التمديد المحتسبة</span>
                <span class="main-value" id="totalExc" style="color:var(--primary)">0 يوم</span>
            </div>

            <div class="result new-start-box">
                <span class="info-label" style="color:var(--primary)">تاريخ البداية الجديد (بعد التمديد)</span>
                <span class="main-value" id="finalStartM">-</span>
                <span class="sub-value" id="finalStartH">-</span>
            </div>

            <div class="result highlight">
                <span class="info-label" style="color:#10b981">تاريخ التخرج النهائي المتوقع</span>
                <span class="main-value" id="finalEndM" style="color:#10b981">-</span>
                <span class="sub-value" id="finalEndH">-</span>
            </div>
        </div>

        <footer>برمجة وتطوير: <b>ماجد العسيري</b></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

    <script>
        let bStart = null, exceptions = [];

        function fillHijri() {
            const months = ["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الثانية","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
            const currYear = parseInt(moment().format('iYYYY'));
            ['hDayS'].forEach(id => { for (let i = 1; i <= 30; i++) document.getElementById(id).innerHTML += `<option value="${i}">${i}</option>`; });
            ['hMonthS'].forEach(id => { months.forEach((m, i) => document.getElementById(id).innerHTML += `<option value="${i+1}">${m}</option>`); });
            ['hYearS'].forEach(id => { for (let i = currYear - 2; i <= currYear + 5; i++) document.getElementById(id).innerHTML += `<option value="${i}">${i}</option>`; });
        }
        fillHijri();

        const fConfig = { locale: "ar", altInput: true, altFormat: "Y-m-d" };
        const fpS = flatpickr("#startDate", { ...fConfig, onChange: d => { bStart = moment(d[0]); calculate(); } });
        const fpES = flatpickr("#excStartM", fConfig);
        const fpEE = flatpickr("#excEndM", fConfig);

        function toH(date) { return moment(date).format('iD iMMMM iYYYY') + " هـ"; }

        function calculate() {
            if (!bStart) return;
            document.getElementById('baseInfoBox').style.display = 'block';
            document.getElementById('startH').innerText = toH(bStart.toDate());
            
            const months = parseInt(document.getElementById('level').value);
            let baseEnd = bStart.clone().add(months, 'months');

            let totalDays = 0;
            const tb = document.getElementById("excTableBody");
            tb.innerHTML = "";

            exceptions.forEach((ex, i) => {
                let intersectStart = moment.max(ex.start, bStart);
                let intersectEnd = moment.min(ex.end, baseEnd);
                let effective = 0;
                if (intersectEnd.isSameOrAfter(intersectStart)) effective = intersectEnd.diff(intersectStart, 'days') + 1;
                totalDays += effective;

                tb.innerHTML += `<tr>
                    <td><span class="exc-range">من ${ex.start.format('YYYY-MM-DD')}</span><span class="exc-range">إلى ${ex.end.format('YYYY-MM-DD')}</span></td>
                    <td style="text-align:center;"><span class="exc-days">${effective} يوم</span></td>
                    <td style="text-align:left;"><i class="fa-solid fa-trash-can" style="color:#f87171;" onclick="removeExc(${i})"></i></td>
                </tr>`;
            });

            document.getElementById('tableContainer').style.display = exceptions.length > 0 ? 'block' : 'none';
            document.getElementById('totalExc').innerText = totalDays + " يوم";
            
            // حساب تاريخ البداية الجديد
            let newStart = bStart.clone().add(totalDays, 'days');
            document.getElementById('finalStartM').innerText = newStart.format('YYYY-MM-DD');
            document.getElementById('finalStartH').innerText = toH(newStart.toDate());

            // حساب تاريخ التخرج النهائي
            let finalEnd = baseEnd.clone().add(totalDays, 'days');
            document.getElementById('finalEndM').innerText = finalEnd.format('YYYY-MM-DD');
            document.getElementById('finalEndH').innerText = toH(finalEnd.toDate());
        }

        function addException() {
            if (!bStart) return alert("حدد تاريخ البداية أولاً");
            let start, end;
            const dInp = document.getElementById('excDays').value;
            const hS = { d: document.getElementById('hDayS').value, m: document.getElementById('hMonthS').value, y: document.getElementById('hYearS').value };

            if (hS.y && hS.m && hS.d) {
                start = moment(`${hS.y}-${hS.m}-${hS.d}`, 'iYYYY-iM-iD');
                end = dInp ? start.clone().add(parseInt(dInp) - 1, 'days') : moment(`${hS.y}-${hS.m}-${hS.d}`, 'iYYYY-iM-iD');
            } else if (fpES.selectedDates[0]) {
                start = moment(fpES.selectedDates[0]);
                end = fpEE.selectedDates[0] ? moment(fpEE.selectedDates[0]) : start.clone().add(parseInt(dInp || 1) - 1, 'days');
            } else if (dInp) {
                start = bStart.clone();
                end = start.clone().add(parseInt(dInp) - 1, 'days');
            }

            if (!start || !start.isValid()) return alert("يرجى إدخال التواريخ بشكل صحيح");
            exceptions.push({ start, end });
            ["hDayS","hMonthS","hYearS","excDays"].forEach(id => document.getElementById(id).value = "");
            fpES.clear(); fpEE.clear();
            calculate();
        }

        function removeExc(i) { exceptions.splice(i, 1); calculate(); }
    </script>
</body>
</html>
