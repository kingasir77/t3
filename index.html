<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>مساعد تعديل التدريب</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {

            --bg:
                radial-gradient(circle at top right, rgba(96, 165, 250, 0.25), transparent 25%),
                radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.20), transparent 20%),
                linear-gradient(135deg, #eaf3ff 0%, #dcecff 35%, #c9e0ff 100%);

            --card:
                rgba(255, 255, 255, 0.62);

            --card-strong:
                rgba(255, 255, 255, 0.82);

            --stroke:
                rgba(255, 255, 255, 0.75);

            --primary:
                #2563eb;

            --primary-light:
                #60a5fa;

            --dark:
                #0f172a;

            --sub:
                #64748b;

            --success:
                #10b981;

            --danger:
                #ef4444;

            --radius-xl: 34px;

            --shadow:
                0 10px 40px rgba(37, 99, 235, 0.12);

        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family: 'Cairo', sans-serif;

            min-height: 100vh;

            background: var(--bg);

            background-attachment: fixed;

            padding: 18px;

            color: var(--dark);

            overflow-x: hidden;
        }

        body::before {

            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            background:
                radial-gradient(circle,
                    rgba(96, 165, 250, 0.35),
                    transparent 70%);

            top: -150px;
            right: -100px;

            z-index: -1;

            filter: blur(30px);
        }

        body::after {

            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            background:
                radial-gradient(circle,
                    rgba(59, 130, 246, 0.18),
                    transparent 70%);

            bottom: -180px;
            left: -120px;

            z-index: -1;

            filter: blur(40px);
        }

        .container {
            max-width: 540px;
            margin: auto;
        }

        .hero {

            position: relative;

            overflow: hidden;

            padding: 26px;

            border-radius: 38px;

            margin-bottom: 18px;

            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, 0.75),
                    rgba(255, 255, 255, 0.55));

            border: 1px solid rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(24px);

            box-shadow: var(--shadow);
        }

        .hero-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 26px;
        }

        .logo {

            width: 62px;
            height: 62px;

            border-radius: 22px;

            background:
                linear-gradient(145deg,
                    #2563eb,
                    #60a5fa);

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 24px;

            box-shadow:
                0 15px 35px rgba(37, 99, 235, 0.35);
        }

        .notif {

            width: 48px;
            height: 48px;

            border-radius: 18px;

            background:
                rgba(255, 255, 255, 0.65);

            display: flex;

            align-items: center;

            justify-content: center;

            color: var(--primary);

            font-size: 18px;

            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .hero h1 {

            font-size: 1.9rem;

            line-height: 1.3;

            margin-bottom: 10px;

            font-weight: 900;
        }

        .glass-card {

            position: relative;

            overflow: hidden;

            background: var(--card);

            border: 1px solid var(--stroke);

            border-radius: var(--radius-xl);

            padding: 22px;

            margin-bottom: 18px;

            backdrop-filter: blur(25px);

            box-shadow: var(--shadow);
        }

        .section-title {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 20px;
        }

        .section-icon {

            width: 46px;
            height: 46px;

            border-radius: 18px;

            background:
                linear-gradient(145deg,
                    #2563eb,
                    #60a5fa);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;
        }

        .grid {

            display: flex;

            flex-direction: column;

            gap: 18px;
        }

        .row-inputs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;
        }

        label,
        .tiny {

            display: block;

            margin-bottom: 9px;

            font-size: 0.78rem;

            color: var(--sub);

            font-weight: 800;
        }

        input,
        select {

            width: 100%;

            border: 1px solid rgba(255, 255, 255, 0.95);

            background:
                rgba(255, 255, 255, 0.72);

            border-radius: 20px;

            padding: 16px 18px;

            font-family: inherit;

            font-size: 0.92rem;

            color: var(--dark);

            outline: none;
        }

        .hijri-group {

            display: flex;

            flex-direction: row;

            gap: 10px;

            width: 100%;
        }

        .hijri-group select {

            flex: 1;

            min-width: 0;
        }

        .btn {

            border: none;

            border-radius: 24px;

            padding: 18px;

            width: 100%;

            cursor: pointer;

            font-family: inherit;

            font-size: 0.96rem;

            font-weight: 900;

            color: white;

            background:
                linear-gradient(145deg,
                    #2563eb,
                    #60a5fa);
        }

        .info-grid {

            display: grid;

            gap: 14px;

            margin-top: 20px;
        }

        .info-box {

            background:
                rgba(255, 255, 255, 0.6);

            border-radius: 26px;

            padding: 18px;
        }

        .info-label {

            display: block;

            font-size: 0.74rem;

            color: var(--sub);

            margin-bottom: 8px;

            font-weight: 800;
        }

        .info-value {

            font-size: 1rem;

            font-weight: 900;
        }

        .result {

            background:
                rgba(255, 255, 255, 0.62);

            border-radius: 30px;

            padding: 24px;

            text-align: center;

            margin-bottom: 16px;
        }

        .main-value {

            display: block;

            font-size: 1.35rem;

            font-weight: 900;

            margin-top: 6px;
        }

        .sub-value {

            display: block;

            color: var(--sub);

            margin-top: 6px;

            font-size: 0.84rem;
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        th {

            color: var(--sub);

            font-size: 0.74rem;

            padding-bottom: 12px;

            text-align: right;
        }

        td {

            padding: 18px 0;

            border-top: 1px solid rgba(148, 163, 184, 0.15);
        }

        .exc-range {

            display: block;

            font-weight: 800;
        }

        .exc-days {

            font-weight: 900;

            color: var(--primary);
        }

        .trash-btn {

            color: var(--danger);

            cursor: pointer;
        }

        footer {

            text-align: center;

            padding: 26px 0 14px;

            color: var(--sub);

            font-size: 0.78rem;
        }

        footer b {

            color: var(--primary);
        }

        @media(max-width: 520px) {

            .row-inputs {
                grid-template-columns: 1fr;
            }

            .hijri-group {

                display: flex;

                flex-direction: row;

                gap: 8px;
            }

            .hijri-group select {

                flex: 1;

                min-width: 0;

                padding: 14px 10px;

                font-size: 0.82rem;
            }

            .hero h1 {
                font-size: 1.55rem;
            }

            .glass-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="glass-card">

            <div class="grid">

                <div>

                    <span class="tiny">من (هجري)</span>

                    <div class="hijri-group">

                        <select id="hDayS">
                            <option value="">يوم</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                        </select>

                        <select id="hMonthS">
                            <option value="">شهر</option>
                            <option>محرم</option>
                            <option>صفر</option>
                        </select>

                        <select id="hYearS">
                            <option value="">سنة</option>
                            <option>1447</option>
                            <option>1448</option>
                        </select>

                    </div>

                </div>

                <div>

                    <span class="tiny">إلى (هجري)</span>

                    <div class="hijri-group">

                        <select id="hDayE">
                            <option value="">يوم</option>
                            <option>1</option>
                            <option>2</option>
                        </select>

                        <select id="hMonthE">
                            <option value="">شهر</option>
                            <option>محرم</option>
                            <option>صفر</option>
                        </select>

                        <select id="hYearE">
                            <option value="">سنة</option>
                            <option>1447</option>
                            <option>1448</option>
                        </select>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
