<!--
استبدل فقط وسم <style> الحالي بهذا بالكامل
بدون تغيير أي JavaScript أو HTML منطقي
-->

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    :root {

        --bg:
            radial-gradient(circle at top right, rgba(59, 130, 246, 0.28), transparent 20%),
            radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.18), transparent 25%),
            linear-gradient(135deg, #edf5ff 0%, #dbeafe 40%, #c7dcff 100%);

        --card:
            rgba(255, 255, 255, 0.55);

        --card-strong:
            rgba(255, 255, 255, 0.72);

        --stroke:
            rgba(255, 255, 255, 0.95);

        --primary:
            #2563eb;

        --primary-light:
            #60a5fa;

        --primary-dark:
            #1d4ed8;

        --success:
            #10b981;

        --danger:
            #ef4444;

        --dark:
            #0f172a;

        --sub:
            #64748b;

        --radius-xl: 34px;

        --shadow:
            0 20px 50px rgba(37, 99, 235, 0.12);

        --glow:
            0 0 40px rgba(96, 165, 250, 0.25);

    }

    html {
        scroll-behavior: smooth;
    }

    body {

        font-family: 'Cairo', sans-serif;

        min-height: 100vh;

        background: var(--bg);

        background-attachment: fixed;

        color: var(--dark);

        padding: 18px;

        overflow-x: hidden;

        position: relative;
    }

    body::before {

        content: "";

        position: fixed;

        width: 500px;
        height: 500px;

        background:
            radial-gradient(circle,
                rgba(96, 165, 250, 0.28),
                transparent 70%);

        top: -200px;
        right: -100px;

        z-index: -2;

        filter: blur(45px);

        animation: float1 8s ease-in-out infinite;
    }

    body::after {

        content: "";

        position: fixed;

        width: 450px;
        height: 450px;

        background:
            radial-gradient(circle,
                rgba(37, 99, 235, 0.18),
                transparent 70%);

        bottom: -180px;
        left: -120px;

        z-index: -2;

        filter: blur(55px);

        animation: float2 10s ease-in-out infinite;
    }

    @keyframes float1 {

        0%,
        100% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(30px);
        }
    }

    @keyframes float2 {

        0%,
        100% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(-25px);
        }
    }

    .container {
        max-width: 560px;
        margin: auto;
        position: relative;
    }

    .topbar-inner {

        position: relative;

        overflow: hidden;

        padding: 24px;

        border-radius: 40px;

        margin-bottom: 22px;

        background:
            linear-gradient(145deg,
                rgba(255, 255, 255, 0.78),
                rgba(255, 255, 255, 0.48));

        border: 1px solid rgba(255, 255, 255, 0.95);

        backdrop-filter: blur(28px);

        box-shadow:
            var(--shadow),
            var(--glow);

        animation: fadeUp 0.7s ease;
    }

    .topbar-inner::before {

        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(120deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent);

        opacity: 0.6;
    }

    .topbar-inner::after {

        content: "";

        position: absolute;

        width: 220px;
        height: 220px;

        border-radius: 50%;

        background:
            radial-gradient(circle,
                rgba(59, 130, 246, 0.18),
                transparent 70%);

        left: -80px;
        top: -80px;
    }

    .app-mini {

        display: flex;

        align-items: center;

        justify-content: space-between;

        position: relative;

        z-index: 2;
    }

    .app-left {

        display: flex;

        align-items: center;

        gap: 18px;
    }

    .logo {

        width: 68px;
        height: 68px;

        border-radius: 24px;

        background:
            linear-gradient(145deg,
                #2563eb,
                #60a5fa);

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 26px;

        color: white;

        box-shadow:
            0 18px 35px rgba(37, 99, 235, 0.35);

        animation: pulse 3s infinite;
    }

    @keyframes pulse {

        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.04);
        }
    }

    .title h1 {

        font-size: 1.35rem;

        font-weight: 900;

        margin-bottom: 5px;

        color: var(--dark);
    }

    .title span {

        font-size: 0.82rem;

        color: var(--sub);

        line-height: 1.7;
    }

    .card {

        position: relative;

        overflow: hidden;

        background: var(--card);

        border: 1px solid var(--stroke);

        border-radius: var(--radius-xl);

        padding: 24px;

        margin-bottom: 18px;

        backdrop-filter: blur(26px);

        box-shadow:
            var(--shadow);

        animation: fadeUp 0.9s ease;
    }

    .card::before {

        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(140deg,
                rgba(255, 255, 255, 0.35),
                transparent 35%);

        pointer-events: none;
    }

    .card:hover {

        transform: translateY(-2px);

        transition: 0.3s;
    }

    .grid {

        display: flex;

        flex-direction: column;

        gap: 18px;

        position: relative;

        z-index: 2;
    }

    .row-inputs {

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 14px;
    }

    label,
    .tiny {

        display: block;

        margin-bottom: 9px;

        color: var(--sub);

        font-size: 0.78rem;

        font-weight: 800;

        letter-spacing: 0.3px;
    }

    input,
    select {

        width: 100%;

        border:
            1px solid rgba(255, 255, 255, 0.95);

        background:
            rgba(255, 255, 255, 0.68);

        border-radius: 22px;

        padding: 17px 18px;

        color: var(--dark);

        font-family: inherit;

        font-size: 0.92rem;

        outline: none;

        transition: 0.25s;

        backdrop-filter: blur(12px);

        box-shadow:
            inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }

    input::placeholder {
        color: #94a3b8;
    }

    input:focus,
    select:focus {

        border-color:
            rgba(59, 130, 246, 0.35);

        box-shadow:
            0 0 0 5px rgba(59, 130, 246, 0.10),
            0 10px 25px rgba(37, 99, 235, 0.08);

        transform: translateY(-1px);
    }

    option {
        color: black;
    }

    .hijri-group {

        display: flex;

        gap: 10px;
    }

    .btn {

        position: relative;

        overflow: hidden;

        border: none;

        border-radius: 26px;

        padding: 18px;

        font-size: 1rem;

        font-weight: 900;

        width: 100%;

        cursor: pointer;

        color: white;

        background:
            linear-gradient(145deg,
                #2563eb,
                #60a5fa);

        box-shadow:
            0 20px 35px rgba(37, 99, 235, 0.28);

        transition: 0.25s;
    }

    .btn::before {

        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(120deg,
                transparent,
                rgba(255, 255, 255, 0.35),
                transparent);

        transform: translateX(-100%);
    }

    .btn:hover::before {

        transform: translateX(100%);

        transition: 0.9s;
    }

    .btn:hover {

        transform: translateY(-3px);

        box-shadow:
            0 25px 45px rgba(37, 99, 235, 0.32);
    }

    .btn:active {
        transform: scale(0.985);
    }

    .info-grid {

        display: grid;

        gap: 14px;

        margin-top: 22px;
    }

    .info-box {

        position: relative;

        overflow: hidden;

        background:
            rgba(255, 255, 255, 0.62);

        border-radius: 26px;

        padding: 18px;

        border: 1px solid rgba(255, 255, 255, 0.95);

        transition: 0.25s;
    }

    .info-box:hover {

        transform: translateY(-2px);

        box-shadow:
            0 15px 30px rgba(37, 99, 235, 0.08);
    }

    .info-label {

        display: block;

        margin-bottom: 7px;

        color: var(--sub);

        font-size: 0.72rem;

        font-weight: 800;
    }

    .info-value {

        display: block;

        font-size: 1rem;

        font-weight: 900;

        color: var(--dark);
    }

    .result {

        position: relative;

        overflow: hidden;

        background:
            rgba(255, 255, 255, 0.62);

        border-radius: 30px;

        padding: 24px;

        text-align: center;

        border: 1px solid rgba(255, 255, 255, 0.95);

        margin-bottom: 18px;

        transition: 0.25s;
    }

    .result::before {

        content: "";

        position: absolute;

        width: 200px;
        height: 200px;

        background:
            radial-gradient(circle,
                rgba(96, 165, 250, 0.12),
                transparent 70%);

        top: -100px;
        right: -70px;
    }

    .result:hover {

        transform: translateY(-2px);
    }

    .highlight {

        background:
            linear-gradient(145deg,
                rgba(16, 185, 129, 0.12),
                rgba(255, 255, 255, 0.72));

        border:
            1px solid rgba(16, 185, 129, 0.22);
    }

    .new-start-box {

        background:
            linear-gradient(145deg,
                rgba(59, 130, 246, 0.14),
                rgba(255, 255, 255, 0.72));

        border:
            1px solid rgba(59, 130, 246, 0.22);
    }

    .main-value {

        font-size: 1.45rem;

        font-weight: 900;

        display: block;

        margin-top: 8px;

        letter-spacing: 0.5px;
    }

    .sub-value {

        font-size: 0.84rem;

        color: var(--sub);

        display: block;

        margin-top: 6px;
    }

    table {

        width: 100%;

        border-collapse: collapse;
    }

    th {

        color: var(--sub);

        font-size: 0.74rem;

        padding-bottom: 12px;

        text-align: right;

        font-weight: 800;
    }

    td {

        padding: 18px 0;

        border-top:
            1px solid rgba(148, 163, 184, 0.15);

        font-size: 0.84rem;

        vertical-align: middle;
    }

    .exc-range {

        display: block;

        font-weight: 800;

        color: var(--dark);

        margin-bottom: 4px;
    }

    .exc-days {

        color: var(--primary);

        font-weight: 900;

        font-size: 0.92rem;
    }

    .badge-out {

        color: var(--danger);

        font-size: 0.68rem;

        font-weight: 900;
    }

    .trash-btn {

        color: var(--danger);

        cursor: pointer;

        transition: 0.2s;
    }

    .trash-btn:hover {

        transform: scale(1.18) rotate(8deg);
    }

    footer {

        text-align: center;

        color: var(--sub);

        font-size: 0.8rem;

        padding: 28px 0 12px;

        opacity: 0.9;
    }

    footer b {

        color: var(--primary);

        font-weight: 900;
    }

    @keyframes fadeUp {

        from {

            opacity: 0;

            transform: translateY(20px);
        }

        to {

            opacity: 1;

            transform: translateY(0);
        }
    }

    /* تحسين flatpickr */

    .flatpickr-calendar {

        border: none !important;

        border-radius: 28px !important;

        overflow: hidden !important;

        background:
            rgba(255, 255, 255, 0.9) !important;

        backdrop-filter: blur(20px);

        box-shadow:
            0 25px 60px rgba(37, 99, 235, 0.18) !important;
    }

    .flatpickr-day.selected {

        background:
            linear-gradient(145deg,
                #2563eb,
                #60a5fa) !important;

        border: none !important;
    }

    .flatpickr-day:hover {

        background:
            rgba(59, 130, 246, 0.12) !important;
    }

    @media(max-width:520px) {

        .row-inputs {
            grid-template-columns: 1fr;
        }

        .hijri-group {
            flex-direction: column;
        }

        .card {
            padding: 20px;
        }

        .topbar-inner {
            padding: 22px;
        }

        .title h1 {
            font-size: 1.1rem;
        }

        .logo {
            width: 58px;
            height: 58px;
        }
    }
</style>
