<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مساعد تعديل التدريب</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* العودة للخلفية المريحة والاحترافية */
            --bg: radial-gradient(circle at top right, #1e3a8a 0%, transparent 25%),
                  radial-gradient(circle at bottom left, #1d4ed8 0%, transparent 25%),
                  linear-gradient(180deg, #020617, #0f172a);
            --card: rgba(15, 23, 42, 0.75);
            --stroke: rgba(255, 255, 255, 0.08);
            --primary: #2563eb;
            --text: #f8fafc;
            --sub: #94a3b8;
            --radius-xl: 28px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text);
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: auto;
        }

        .topbar-inner {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--stroke);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #60a5fa); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .title h1 { font-size: 1rem; font-weight: 800; }

        .card {
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(15px);
        }

        .grid { display: flex; flex-direction: column; gap: 16px; }
        
        /* حل مشكلة التداخل */
        .row-inputs {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .row-inputs > div { flex: 1; }

        label, .tiny {
            display: block;
            margin-bottom: 6px;
            color: var(--sub);
            font-size: 0.75rem;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus { border-color: var(--primary); background: rgba(37, 99, 235, 0.1); }

        .hijri-group { display: flex; gap: 6px; }

        .btn {
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            color: white; border: none;
            border-radius: 16px; padding: 16px;
            font-weight: 800; font-size: 1rem;
            width: 100%; cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        /* صناديق المعلومات */
        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--stroke);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            margin-top: 10px;
        }

        .result {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 22px;
            padding: 18px;
            text-align: center;
            margin-bottom: 12px;
            border: 1px solid var(--stroke);
        }
        
        .new-start-box { border-color: rgba(37, 99, 235, 0.3); background: rgba(37, 99, 235, 0.05); }
        .highlight { border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); }

        .info-label { font-size: 0.7rem; color: var(--sub); display: block; margin-bottom: 4px; }
        .main-value { font-size: 1.15rem; font-weight: 900; display: block; }
        .sub-value { font-size: 0.8rem; color: var(--sub); display: block; margin-top: 4px; }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        td { padding: 12px 0; border-top: 1px solid var(--stroke); vertical-align: middle; }
        
        .exc-range { display: block; font-weight: 700; color: #cbd5e1; font-size: 0.75rem; line-height: 1.4; }
        .exc-days { color: var(--primary); font-weight: 900; font-size: 0.85rem; }

        footer { text-align: center; color: var(--sub); font-size: 0.75rem; padding: 25px 0; }

        /* خاص للايفون */
        @media screen and (max-width: 480px) {
            input, select { font-size: 16px !important; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="topbar-inner">
            <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
            <div class="title"><h1>مساعد تعديل التدريب</h1></div>
        </div>

        <div class="card">
            <div class="grid">
                <div>
                    <label>المدة المقررة</label>
                    <select id="level" onchange="calculate()">
                        <option value="18">18 شهر — المستوى الخامس</option>
                        <option value="24">24 شهر — المستوى السابع</option>
                    </select>
                </div>
                <div>
                    <label>تاريخ بداية التدريب (المباشرة)</label>
                    <input type="text" id="startDate" readonly placeholder="حدد تاريخ المباشرة">
                </div>
            </div>

            <div id="baseInfoBox" style="display:none">
                <div class="info-box">
                    <span class="info-label">تاريخ المباشرة بالهجري</span>
                    <span id="startH" style="font-weight:800;">-</span>
                </div>
            </div>
        </div>

        <div class="card">
            <label style="color:white; margin-bottom:15px; display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-calendar-circle-plus" style="color: var(--primary);"></i> إضافة تمديد أو تعديل
            </label>
            
            <div class="grid">
                <div class="row-inputs">
                    <div>
                        <span class="tiny">من (ميلادي)</span>
                        <input type="text" id="excStartM" readonly placeholder="اختر">
                    </div>
                    <div>
                        <span class="tiny">إلى (ميلادي)</span>
                        <input type="text" id="excEndM" readonly placeholder="اختر">
                    </div>
                </div>

                <div>
                    <span class="tiny">أو حدد التاريخ هجرياً</span>
                    <div class="hijri-group">
                        <select id="hDayS"><option value="">يوم</option></select>
                        <select id="hMonthS"><option value="">شهر</option></select>
                        <select id="hYearS"><option value="">سنة</option></select>
                    </div>
                </div>

                <div>
                    <label>أو أدخل عدد الأيام مباشرة</label>
                    <input type="number" id="excDays" placeholder="مثال: 15">
                </div>

                <button class="btn" onclick="addException()">إضافة للجدول</button>
            </div>
        </div>

        <div class="card">
            <div id="tableContainer" style="display:none; margin-bottom:20px;">
                <table>
                    <tbody id="excTableBody"></tbody>
                </table>
            </div>

            <div class="result">
                <span class="info-label">إجمالي أيام التمديد</span>
                <span class="main-value" id="totalExc" style="color:var(--primary)">0 يوم</span>
            </div>

            <div class="result new-start-box">
                <span class="info-label" style="color:var(--primary)">تاريخ البداية الفعلي (بعد التعديل)</span>
                <span class="main-value" id="finalStartM">-</span>
                <span class="sub-value" id="finalStartH">-</span>
            </div>

            <div class="result highlight">
                <span class="info-label" style="color:#10b981">تاريخ نهاية التدريب (التخرج)</span>
                <span class="main-value" id="finalEndM" style="color:#10b981">-</span>
                <span class="sub-value" id="finalEndH">-</span>
            </div>
        </div>

        <footer>برمجة وتطوير: <b>ماجد العسيري</b></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

    <script>
        let bStart = null, exceptions = [];

        function fillHijri() {
            const months = ["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الثانية","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
            const currYear = parseInt(moment().format('iYYYY'));
            for (let i = 1; i <= 30; i++) document.getElementById('hDayS').innerHTML += `<option value="${i}">${i}</option>`;
            months.forEach((m, i) => document.getElementById('hMonthS').innerHTML += `<option value="${i+1}">${m}</option>`);
            for (let i = currYear - 2; i <= currYear + 5; i++) document.getElementById('hYearS').innerHTML += `<option value="${i}">${i}</option>`;
        }
        fillHijri();

        const fConfig = { locale: "ar", altInput: true, altFormat: "Y-m-d" };
        const fpS = flatpickr("#startDate", { ...fConfig, onChange: d => { bStart = moment(d[0]); calculate(); } });
        const fpES = flatpickr("#excStartM", fConfig);
        const fpEE = flatpickr("#excEndM", fConfig);

        function toH(date) { return moment(date).format('iD iMMMM iYYYY') + " هـ"; }

        function calculate() {
            if (!bStart) return;
            document.getElementById('baseInfoBox').style.display = 'block';
            document.getElementById('startH').innerText = toH(bStart.toDate());
            
            const months = parseInt(document.getElementById('level').value);
            let baseEnd = bStart.clone().add(months, 'months');

            let totalDays = 0;
            const tb = document.getElementById("excTableBody");
            tb.innerHTML = "";

            exceptions.forEach((ex, i) => {
                let intersectStart = moment.max(ex.start, bStart);
                let intersectEnd = moment.min(ex.end, baseEnd);
                let effective = 0;
                if (intersectEnd.isSameOrAfter(intersectStart)) effective = intersectEnd.diff(intersectStart, 'days') + 1;
                totalDays += effective;

                tb.innerHTML += `<tr>
                    <td><span class="exc-range">من: ${ex.start.format('YYYY-MM-DD')}</span><span class="exc-range">إلى: ${ex.end.format('YYYY-MM-DD')}</span></td>
                    <td style="text-align:center;"><span class="exc-days">${effective} يوم</span></td>
                    <td style="text-align:left;"><i class="fa-solid fa-trash-can" style="color:#f87171; cursor:pointer;" onclick="removeExc(${i})"></i></td>
                </tr>`;
            });

            document.getElementById('tableContainer').style.display = exceptions.length > 0 ? 'block' : 'none';
            document.getElementById('totalExc').innerText = totalDays + " يوم";
            
            let newStart = bStart.clone().add(totalDays, 'days');
            document.getElementById('finalStartM').innerText = newStart.format('YYYY-MM-DD');
            document.getElementById('finalStartH').innerText = toH(newStart.toDate());

            let finalEnd = baseEnd.clone().add(totalDays, 'days');
            document.getElementById('finalEndM').innerText = finalEnd.format('YYYY-MM-DD');
            document.getElementById('finalEndH').innerText = toH(finalEnd.toDate());
        }

        function addException() {
            if (!bStart) return alert("حدد تاريخ البداية أولاً");
            let start, end;
            const dInp = document.getElementById('excDays').value;
            const hS = { d: document.getElementById('hDayS').value, m: document.getElementById('hMonthS').value, y: document.getElementById('hYearS').value };

            if (hS.y && hS.m && hS.d) {
                start = moment(`${hS.y}-${hS.m}-${hS.d}`, 'iYYYY-iM-iD');
                end = dInp ? start.clone().add(parseInt(dInp) - 1, 'days') : start.clone();
            } else if (fpES.selectedDates[0]) {
                start = moment(fpES.selectedDates[0]);
                end = fpEE.selectedDates[0] ? moment(fpEE.selectedDates[0]) : start.clone().add(parseInt(dInp || 1) - 1, 'days');
            } else if (dInp) {
                start = bStart.clone();
                end = start.clone().add(parseInt(dInp) - 1, 'days');
            }

            if (!start || !start.isValid()) return alert("يرجى إدخال البيانات بشكل صحيح");
            exceptions.push({ start, end });
            ["hDayS","hMonthS","hYearS","excDays"].forEach(id => document.getElementById(id).value = "");
            fpES.clear(); fpEE.clear();
            calculate();
        }

        function removeExc(i) { exceptions.splice(i, 1); calculate(); }
    </script>
</body>
</html>
