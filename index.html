<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مساعد تعديل التدريب</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>

    <style>
        /* التنسيقات الأصلية الخاصة بك كما هي دون تغيير */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: radial-gradient(circle at top right, #1e3a8a 0%, transparent 25%),
                  radial-gradient(circle at bottom left, #1d4ed8 0%, transparent 25%),
                  linear-gradient(180deg, #020617, #0f172a);
            --card: rgba(15, 23, 42, 0.72);
            --stroke: rgba(255, 255, 255, 0.06);
            --primary: #2563eb;
            --text: #f8fafc;
            --sub: #94a3b8;
            --radius-xl: 30px;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: auto;
        }

        .topbar-inner {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            background: rgba(15, 23, 42, .75);
            border: 1px solid var(--stroke);
            border-radius: 24px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .app-mini { display: flex; align-items: center; justify-content: space-between; }
        .app-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 45px; height: 45px; border-radius: 15px; background: linear-gradient(135deg, #2563eb, #60a5fa); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .title h1 { font-size: 1rem; font-weight: 800; }
        .live-dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }

        .card {
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .grid { display: flex; flex-direction: column; gap: 15px; }
        
        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label, .tiny {
            display: block;
            margin-bottom: 6px;
            color: var(--sub);
            font-size: 0.75rem;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 14px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); background: rgba(37, 99, 235, 0.1); }

        .hijri-group { display: flex; gap: 6px; }
        .hijri-group select { padding: 12px 5px; font-size: 0.75rem; text-align: center; }

        .btn {
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            color: white; border: none;
            border-radius: 18px; padding: 16px;
            font-weight: 800; font-size: 1rem;
            width: 100%; margin-top: 10px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
            cursor: pointer;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 18px;
            text-align: center;
        }

        .info-label { font-size: 0.65rem; color: var(--sub); display: block; margin-bottom: 4px; }
        .info-value { font-size: 0.85rem; font-weight: 800; color: #fff; }

        .result {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            margin-bottom: 12px;
        }
        .highlight { border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); }
        .main-value { font-size: 1.2rem; font-weight: 900; display: block; margin-top: 5px; }
        .sub-value { font-size: 0.8rem; color: var(--sub); margin-top: 5px; display: block; }

        footer { text-align: center; color: var(--sub); font-size: 0.75rem; padding: 20px 0; }

        .badge-out { color: #ef4444; font-size: 0.7rem; display: block; font-weight: bold; }

        @media screen and (max-width: 768px) {
            input, select { font-size: 16px !important; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="topbar-inner">
            <div class="app-mini">
                <div class="app-left">
                    <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
                    <div class="title">
                        <h1>مساعد تعديل التدريب</h1>
                    </div>
                </div>
                <div class="live-dot"></div>
            </div>
        </div>

        <div class="card">
            <div class="grid">
                <div>
                    <label>المدة المقررة</label>
                    <select id="level" onchange="calculate()">
                        <option value="18">18 شهر — المستوى الخامس</option>
                        <option value="24">24 شهر — المستوى السابع</option>
                    </select>
                </div>

                <div>
                    <label>تاريخ بداية التدريب</label>
                    <input type="text" id="startDate" readonly placeholder="اختر التاريخ">
                </div>
            </div>

            <div id="baseInfoBox" style="display:none" class="info-grid">
                <div class="info-box">
                    <span class="info-label">البداية هجري</span>
                    <span id="startH" class="info-value">-</span>
                </div>
                <div class="info-box">
                    <span class="info-label">النهاية الافتراضية</span>
                    <span id="endM_base" class="info-value" style="color:#60a5fa">-</span>
                </div>
            </div>
        </div>

        <div class="card">
            <label style="color:white; margin-bottom:15px; display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-plus-circle" style="color: #60a5fa;"></i> إضافة تعديل أو تمديد
            </label>
            
            <div class="grid">
                <div class="row-inputs">
                    <div>
                        <span class="tiny">من (ميلادي)</span>
                        <input type="text" id="excStartM" readonly placeholder="اختر">
                    </div>
                    <div>
                        <span class="tiny">إلى (ميلادي)</span>
                        <input type="text" id="excEndM" readonly placeholder="اختر">
                    </div>
                </div>

                <div>
                    <span class="tiny">من (هجري)</span>
                    <div class="hijri-group">
                        <select id="hDayS"><option value="">يوم</option></select>
                        <select id="hMonthS"><option value="">شهر</option></select>
                        <select id="hYearS"><option value="">سنة</option></select>
                    </div>
                </div>

                <div>
                    <span class="tiny">إلى (هجري)</span>
                    <div class="hijri-group">
                        <select id="hDayE"><option value="">يوم</option></select>
                        <select id="hMonthE"><option value="">شهر</option></select>
                        <select id="hYearE"><option value="">سنة</option></select>
                    </div>
                </div>

                <div>
                    <label>أو عدد أيام التمديد مباشرة</label>
                    <input type="number" id="excDays" placeholder="مثال: 15">
                </div>

                <button class="btn" onclick="addException()">إضافة للجدول</button>
            </div>
        </div>

        <div class="card">
            <div id="tableContainer" style="display:none; margin-bottom:20px;">
                <table id="excTable" style="width:100%; border-collapse:collapse; font-size:0.8rem;">
                    <thead style="color:var(--sub); border-bottom:1px solid var(--stroke);">
                        <tr>
                            <th style="padding:10px; text-align:right;">الفترة</th>
                            <th style="padding:10px;">الأيام</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="result">
                <span class="info-label">إجمالي التعديل (المعتمد)</span>
                <span class="main-value" id="totalExc" style="color:#60a5fa">0 يوم</span>
            </div>

            <div class="result highlight">
                <span class="info-label" style="color:#10b981">تاريخ نهاية التدريب المتوقع</span>
                <span class="main-value" id="finalEndM" style="color:#10b981">-</span>
                <span class="sub-value" id="finalEndH">-</span>
            </div>
        </div>

        <footer>
            برمجة وتطوير: <b>ماجد العسيري</b>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

    <script>
        let bStart = null, exceptions = [];

        function fillHijriLists() {
            const months = ["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الثانية","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
            const currYear = parseInt(moment().format('iYYYY'));
            ['hDayS', 'hDayE'].forEach(id => {
                for (let i = 1; i <= 30; i++) document.getElementById(id).innerHTML += `<option value="${i}">${i}</option>`;
            });
            ['hMonthS', 'hMonthE'].forEach(id => {
                months.forEach((m, i) => document.getElementById(id).innerHTML += `<option value="${i+1}">${m}</option>`);
            });
            ['hYearS', 'hYearE'].forEach(id => {
                for (let i = currYear - 2; i <= currYear + 5; i++) document.getElementById(id).innerHTML += `<option value="${i}">${i}</option>`;
            });
        }
        fillHijriLists();

        const fConfig = { locale: "ar", altInput: true, altFormat: "j F Y" };
        const fpS = flatpickr("#startDate", { ...fConfig, onChange: d => { bStart = moment(d[0]); calculate(); } });
        const fpES = flatpickr("#excStartM", fConfig);
        const fpEE = flatpickr("#excEndM", fConfig);

        function toH(date) { return moment(date).format('iD iMMMM iYYYY') + " هـ"; }

        function calculate() {
            if (!bStart) return;

            document.getElementById('baseInfoBox').style.display = 'grid';
            document.getElementById('startH').innerText = toH(bStart.toDate());
            
            const mVal = parseInt(document.getElementById('level').value);
            // تاريخ النهاية الافتراضي (بدون تمديد)
            let baseEnd = bStart.clone().add(mVal, 'months');
            document.getElementById('endM_base').innerText = baseEnd.format('YYYY-MM-DD');

            let totalEffectiveDays = 0;
            const tb = document.querySelector("#excTable tbody");
            tb.innerHTML = "";

            if (exceptions.length > 0) document.getElementById('tableContainer').style.display = 'block';

            exceptions.forEach((ex, i) => {
                // المنطق المطور: التحقق من تداخل فترة التمديد مع فترة التدريب
                let intersectStart = moment.max(ex.start, bStart);
                let intersectEnd = moment.min(ex.end, baseEnd);

                let effective = 0;
                if (intersectEnd.isSameOrAfter(intersectStart)) {
                    effective = intersectEnd.diff(intersectStart, 'days') + 1;
                }

                totalEffectiveDays += effective;

                tb.innerHTML += `<tr>
                    <td style="padding:8px;">${ex.start.format('DD/MM')} - ${ex.end.format('DD/MM')}</td>
                    <td style="text-align:center;">
                        ${effective} ي 
                        ${effective === 0 ? '<span class="badge-out">خارج النطاق</span>' : ''}
                    </td>
                    <td style="text-align:center;">
                        <span style="color:#ef4444; font-weight:bold; cursor:pointer;" onclick="removeExc(${i})">حذف</span>
                    </td>
                </tr>`;
            });

            document.getElementById('totalExc').innerText = totalEffectiveDays + " يوم";
            
            // تاريخ التخرج النهائي = النهاية الافتراضية + أيام التمديد المحتسبة
            let finalEnd = baseEnd.clone().add(totalEffectiveDays, 'days');
            
            document.getElementById('finalEndM').innerText = finalEnd.format('YYYY-MM-DD');
            document.getElementById('finalEndH').innerText = toH(finalEnd.toDate());
        }

        function addException() {
            if (!bStart) return alert("حدد تاريخ البداية أولاً");
            
            let start, end;
            const dInp = document.getElementById('excDays').value;
            const hS = { d: document.getElementById('hDayS').value, m: document.getElementById('hMonthS').value, y: document.getElementById('hYearS').value };
            const hE = { d: document.getElementById('hDayE').value, m: document.getElementById('hMonthE').value, y: document.getElementById('hYearE').value };

            // تحديد التاريخ بناءً على المدخلات (هجري أو ميلادي أو أيام)
            if (hS.y && hS.m && hS.d) {
                start = moment(`${hS.y}-${hS.m}-${hS.d}`, 'iYYYY-iM-iD');
                end = dInp ? start.clone().add(parseInt(dInp) - 1, 'days') : moment(`${hE.y}-${hE.m}-${hE.d}`, 'iYYYY-iM-iD');
            } else if (fpES.selectedDates[0]) {
                start = moment(fpES.selectedDates[0]);
                end = dInp ? start.clone().add(parseInt(dInp) - 1, 'days') : moment(fpEE.selectedDates[0]);
            } else if (dInp) {
                // إذا أدخل أيام فقط، نفترض أنها تبدأ من اليوم (أو يمكنك جعلها من بداية التدريب)
                start = bStart.clone();
                end = start.clone().add(parseInt(dInp) - 1, 'days');
            }

            if (!start || !end || !start.isValid() || !end.isValid()) return alert("يرجى إدخال البيانات بشكل صحيح");

            exceptions.push({ start: start, end: end });
            
            // تنظيف الحقول
            ["hDayS","hMonthS","hYearS","hDayE","hMonthE","hYearE","excDays"].forEach(id => document.getElementById(id).value = "");
            fpES.clear(); fpEE.clear();
            
            calculate();
        }

        function removeExc(i) {
            exceptions.splice(i, 1);
            if (exceptions.length === 0) document.getElementById('tableContainer').style.display = 'none';
            calculate();
        }
    </script>
</body>
</html>
